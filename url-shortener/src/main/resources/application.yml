
server:
  port: 8081

spring:
  application:
    name: url-shortener

  datasource:
    url: "jdbc:postgresql://127.0.0.1:5433/url_shortener?options=-c%20TimeZone%3DAsia%2FKolkata"
    username: url_admin
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
